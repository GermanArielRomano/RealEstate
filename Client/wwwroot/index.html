<head>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Real Estate Propiedades" />
    <meta property="og:title" content="Real Estate Propiedades · Encuentra tu próxima propiedad" />
    <meta property="og:description" content="Casas, departamentos y terrenos en venta y alquiler. Busca en el mapa y compara." />
    <meta property="og:image" content="__APP_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />

    <base href="/" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh">
            <span class="re-logo-mark" style="--logo-size:72px;opacity:.85" role="img" aria-label="Cargando"></span>
        </div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="" class="reload">Recargar</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        // Utilidades que Blazor llama por interop
        window.reTheme = { prefersDark: () => window.matchMedia('(prefers-color-scheme: dark)').matches };
        window.reShare = async (title, url) => {
            try {
                if (navigator.share) { await navigator.share({ title, url }); return 'shared'; }
                await navigator.clipboard.writeText(url);
                return 'copied';
            } catch (e) { return 'cancelled'; }
        };
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js');
    </script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="js/map.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
