name: Deploy panel y app de compradores (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "Panel/**"
      - "Client/**"
      - ".github/workflows/deploy-panel.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validar API_BASE_URL
        run: |
          if [ -z "${{ vars.API_BASE_URL }}" ]; then
            echo "Falta la variable de repositorio API_BASE_URL (ej: https://realestate-api.onrender.com/)"; exit 1
          fi

      # Se ajusta el código fuente ANTES de publicar
      - name: Configurar URL de la API y base href
        run: |
          for app in Panel Client; do
            echo "{ \"ApiBaseUrl\": \"${{ vars.API_BASE_URL }}\" }" > $app/wwwroot/appsettings.json
          done
          # GitHub Pages sirve el sitio en /<repo>/ ; el panel en la raíz y la app de compradores en /app/
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' Panel/wwwroot/index.html
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/app/" />|' Client/wwwroot/index.html
          # Dirección absoluta del sitio para las etiquetas de vista previa (las apps de mensajería exigen URL completas)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed -i "s|__APP_URL__|https://$OWNER.github.io/${{ github.event.repository.name }}/app|g" Client/wwwroot/index.html

      - name: Publicar panel
        run: dotnet publish Panel/RealEstate.Panel.csproj -c Release -o release/panel

      - name: Publicar app de compradores
        run: dotnet publish Client/RealEstate.Client.csproj -c Release -o release/client

      - name: Armar el sitio
        run: |
          mkdir -p site/app
          cp -r release/panel/wwwroot/. site/
          cp -r release/client/wwwroot/. site/app/
          # GitHub Pages no tiene "fallback" de SPA: el 404.html del panel permite refrescar en sus subrutas
          cp site/index.html site/404.html
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
