name: Deploy panel (GitHub Pages)

on:
  push:
    branches: [master]
    paths:
      - "Panel/**"
      - ".github/workflows/deploy-panel.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # IMPORTANTE: false evita que se pisen las colas de subida

jobs:
  build-and-deploy:          # Unificamos el bloque para asegurar que los archivos no se pierdan
    runs-on: ubuntu-latest
    environment:
      name: github-pages-v2  # CLAVE: Forzamos un entorno nuevo para destrabar el error 400
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validar API_BASE_URL
        run: |
          if [ -z "${{ vars.API_BASE_URL }}" ]; then
            echo "Falta la variable de repositorio API_BASE_URL (ej: https://onrender.com)"; exit 1
          fi

      - name: Configurar URL de la API y base href
        run: |
          echo "{ \"ApiBaseUrl\": \"${{ vars.API_BASE_URL }}\" }" > Panel/wwwroot/appsettings.json
          sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' Panel/wwwroot/index.html

      - name: Publicar
        run: dotnet publish Panel/RealEstate.Panel.csproj -c Release -o release

      - name: Fallback SPA + .nojekyll
        run: |
          cp release/wwwroot/index.html release/wwwroot/404.html
          touch release/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot
      - id: deployment
        uses: actions/deploy-pages@v4